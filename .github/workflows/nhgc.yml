name: nhgc

on:
  push:
    paths:
      - "nhgc/**"
      - ".github/workflows/nhgc.yml"
    branches:
      - "*"
  pull_request:
    paths:
      - "nhgc/**"
      - ".github/workflows/nhgc.yml"
    branches: [main]

jobs:
  test:
    name: test (deno ${{ matrix.deno-version }})
    runs-on: ubuntu-latest
    environment: CI
    strategy:
      matrix:
        deno-version: [2.9.x]

    steps:
      - name: Git Checkout NHGC
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Deno Version ${{ matrix.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Lint Deno Module
        working-directory: nhgc
        run: |
          deno fmt --check
          deno lint

      - name: Test Deno Module
        working-directory: nhgc
        env:
          TMPDIR: ${{ runner.temp }}
          CI: true
          NHG_APIKEY: ${{ secrets.NHG_APIKEY }}
          NHG_URL: ${{ secrets.NHG_URL }}
        run: |
          deno test --allow-all --parallel --fail-fast --coverage=./cov
