name: release

# pushing a tag <module>/v<version> (for example counters/v1.0.2) tests the
# module, checks that both registries accept it, and then publishes it to jsr
# and npm. versions with a qualifier (1.0.2-0) go to the npm tag next. a
# version already on a registry is skipped there, so a failed release can be
# rerun. npm publishes with trusted publishing (oidc), so each npm package
# must trust this workflow (release.yml) and the CI environment.

on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      module:
        required: true
        type: choice
        options:
          - counters
          - fastingest
          - messagepipeline
          - muxsub
          - nhgc
      version:
        required: true
        description: "version (no v prefix), e.g. 1.2.3"
      dry_run:
        type: boolean
        default: true
        description: "test and dry-run publish, skip the upload"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOD="${{ inputs.module }}"
            VER="${{ inputs.version }}"
            DRY="${{ inputs.dry_run }}"
          else
            REF="${{ github.ref_name }}"
            MOD="${REF%%/v*}"
            VER="${REF##*/v}"
            DRY="false"
          fi
          # qualified versions (1.2.3-0) go to next, so they don't become latest
          if [[ "$VER" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          if [ ! -d "$MOD" ]; then
            echo "module dir not found: $MOD"; exit 1
          fi
          HAS_NPM=false
          HAS_JSR=false
          [ -f "$MOD/package.json" ] && HAS_NPM=true
          [ -f "$MOD/deno.json" ]    && HAS_JSR=true
          if [ "$HAS_NPM" = "false" ] && [ "$HAS_JSR" = "false" ]; then
            echo "no package.json or deno.json in $MOD"; exit 1
          fi
          {
            echo "module=$MOD"
            echo "version=$VER"
            echo "dry_run=$DRY"
            echo "npm_tag=$NPM_TAG"
            echo "has_npm=$HAS_NPM"
            echo "has_jsr=$HAS_JSR"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::module=$MOD version=$VER dry_run=$DRY npm=$HAS_NPM jsr=$HAS_JSR tag=$NPM_TAG"

      - name: verify versions match the tag
        working-directory: ${{ steps.ctx.outputs.module }}
        shell: bash
        run: |
          V="${{ steps.ctx.outputs.version }}"
          if [ "${{ steps.ctx.outputs.has_npm }}" = "true" ]; then
            P=$(jq -r .version package.json)
            if [ "$V" != "$P" ]; then
              echo "version mismatch: tag=$V package.json=$P"; exit 1
            fi
          fi
          if [ "${{ steps.ctx.outputs.has_jsr }}" = "true" ]; then
            D=$(jq -r .version deno.json)
            if [ "$V" != "$D" ]; then
              echo "version mismatch: tag=$V deno.json=$D"; exit 1
            fi
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x

      - uses: actions/setup-node@v6
        if: steps.ctx.outputs.has_npm == 'true'
        with:
          node-version: 26.x
          registry-url: "https://registry.npmjs.org"

      - name: install nats-server
        uses: aricart/install-binary@v2.0.0
        with:
          repo: nats-io/nats-server
          name: nats-server

      - name: test
        if: steps.ctx.outputs.has_jsr == 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        env:
          NHG_APIKEY: ${{ secrets.NHG_APIKEY }}
          NHG_URL: ${{ secrets.NHG_URL }}
        run: |
          deno test -A
          deno task clean 2>/dev/null || true

      # nothing is published until both registries accept the module, so a
      # broken npm build doesn't leave a version on jsr only

      - name: jsr dry-run
        if: steps.ctx.outputs.has_jsr == 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        run: deno publish --allow-dirty --dry-run

      - name: npm build
        if: steps.ctx.outputs.has_npm == 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        run: |
          npm install
          npm run build

      - name: npm dry-run
        if: steps.ctx.outputs.has_npm == 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        run: npm pack --dry-run

      - name: jsr publish
        if: steps.ctx.outputs.has_jsr == 'true' && steps.ctx.outputs.dry_run != 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        shell: bash
        run: |
          NAME=$(jq -r .name deno.json)
          VER="${{ steps.ctx.outputs.version }}"
          if curl -sf -o /dev/null "https://jsr.io/${NAME}/${VER}_meta.json"; then
            echo "$NAME@$VER is already on jsr, skipping"
          else
            deno publish --allow-dirty
          fi

      - name: npm publish
        if: steps.ctx.outputs.has_npm == 'true' && steps.ctx.outputs.dry_run != 'true'
        working-directory: ${{ steps.ctx.outputs.module }}
        shell: bash
        run: |
          NAME=$(jq -r .name package.json)
          VER="${{ steps.ctx.outputs.version }}"
          if [ -n "$(npm view "$NAME@$VER" version 2>/dev/null)" ]; then
            echo "$NAME@$VER is already on npm, skipping"
          else
            npm publish --provenance --access public --tag=${{ steps.ctx.outputs.npm_tag }}
          fi
